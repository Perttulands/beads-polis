[package]
name = "beads-polis"
version = "0.1.0"
edition = "2021"
description = "Event-sourced work tracker — JSONL source of truth, SQLite derived index"

[[bin]]
name = "br"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
serde_yaml = "0.9"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
